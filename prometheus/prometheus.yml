global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "greenlane-backend"
    static_configs:
      - targets:
          - "backend:8000"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "backend"
